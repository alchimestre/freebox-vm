services:
  traefik:
    image: traefik:v3.8.0
    restart: unless-stopped
    command:
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [default, hermes-proxy]

  forgejo:
    image: codeberg.org/forgejo/forgejo:15.0.12
    restart: unless-stopped
    environment:
      FORGEJO__server__DOMAIN: git.${STACK_DOMAIN:?}
      FORGEJO__server__ROOT_URL: https://git.${STACK_DOMAIN:?}/
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:?}
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:?}
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__mirror__DEFAULT_INTERVAL: ${MIRROR_INTERVAL_SECONDS:?}s
    ports:
      - "${FORGEJO_SSH_PORT:?}:22"
    volumes:
      - ./forgejo:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.forgejo.rule: Host(`git.${STACK_DOMAIN:?}`)
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.routers.forgejo.tls.certresolver: le
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"

  forgejo-mirror:
    build: ./forgejo-mirror
    profiles: [mirror]
    restart: unless-stopped
    depends_on: [forgejo]
    environment:
      GITHUB_TOKEN: ${GITHUB_MIRROR_TOKEN:-}
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_USER: ${FORGEJO_ADMIN_USER:?}
      FORGEJO_PASSWORD: ${FORGEJO_ADMIN_PASSWORD:?}
      SYNC_INTERVAL_SECONDS: ${MIRROR_INTERVAL_SECONDS:?}
    volumes:
      - forgejo-mirror:/state

  hermes:
    image: nousresearch/hermes-agent:v0.23.4
    restart: unless-stopped
    command: [gateway, run]
    environment:
      HERMES_UID: "${HERMES_UID:?}"
      HERMES_GID: "${HERMES_UID:?}"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_USER:?}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_PASSWORD:?}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_SESSION_SECRET:?}
      CLAUDE_CONFIG_DIR: /opt/data/claude
      CLAUDE_SUBSCRIPTION_DIRECTSDK_COMMAND: /opt/data/claude-cli/bin/claude
    volumes:
      - ./hermes:/opt/data
    networks: [hermes-proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: hermes-proxy
      traefik.http.routers.hermes.rule: Host(`${STACK_DOMAIN:?}`)
      traefik.http.routers.hermes.entrypoints: websecure
      traefik.http.routers.hermes.tls.certresolver: le
      traefik.http.services.hermes.loadbalancer.server.port: "${HERMES_WEBAPP_PORT:?}"

networks:
  default:
    name: web
  hermes-proxy:
    name: hermes-proxy
    ipam:
      config:
        - subnet: ${HERMES_PROXY_SUBNET:?}

volumes:
  letsencrypt:
  forgejo-mirror:
