<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">freebox-vm architecture</title>
  <desc id="desc">image, terraform and ansible build and deploy a VM on the Freebox. The VM runs a Docker Compose stack of Traefik, Gogs, Doco-CD, gogs-mirror and Hermes Agent, with external services around it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="50" font-size="22" fill="#8b949e">Build and deploy</text>

    <rect x="40" y="70" width="340" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="60" y="112" font-size="24" font-weight="700" fill="#58a6ff">image/</text>
    <text x="60" y="148" font-size="20" fill="#c9d1d9">mkosi builds the VM disk</text>

    <rect x="40" y="230" width="340" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="60" y="272" font-size="24" font-weight="700" fill="#58a6ff">terraform/</text>
    <text x="60" y="308" font-size="20" fill="#c9d1d9">VM, DHCP lease, DuckDNS record</text>

    <rect x="40" y="390" width="340" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="60" y="432" font-size="24" font-weight="700" fill="#58a6ff">ansible/</text>
    <text x="60" y="468" font-size="20" fill="#c9d1d9">deploys stack/ to /opt/stack</text>

    <line x1="210" y1="180" x2="210" y2="228" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="210" y1="340" x2="210" y2="388" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="380" y1="285" x2="478" y2="285" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="380" y1="445" x2="498" y2="445" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="480" y="40" width="680" height="500" rx="16" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <text x="500" y="76" font-size="24" font-weight="700" fill="#58a6ff">Freebox</text>

    <rect x="500" y="96" width="640" height="424" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="520" y="130" font-size="22" fill="#c9d1d9">Arch Linux ARM VM (aarch64), Docker Compose</text>

    <rect x="520" y="146" width="300" height="110" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <text x="540" y="188" font-size="24" font-weight="700" fill="#f0f6fc">Traefik</text>
    <text x="540" y="224" font-size="20" fill="#8b949e">Ports 80, 443</text>
    <text x="540" y="246" font-size="20" fill="#8b949e">TLS via Let's Encrypt</text>

    <rect x="840" y="146" width="300" height="110" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <text x="860" y="188" font-size="24" font-weight="700" fill="#f0f6fc">Gogs</text>
    <text x="860" y="224" font-size="20" fill="#8b949e">SSH on port 2222</text>
    <text x="860" y="246" font-size="20" fill="#8b949e">Git server</text>

    <rect x="520" y="276" width="300" height="110" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="540" y="318" font-size="24" font-weight="700" fill="#f0f6fc">Doco-CD</text>
    <text x="540" y="354" font-size="20" fill="#8b949e">Polls DOCO_POLL_URL</text>
    <text x="540" y="376" font-size="20" fill="#8b949e">Uses Docker socket</text>

    <rect x="840" y="276" width="300" height="110" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="860" y="318" font-size="24" font-weight="700" fill="#f0f6fc">gogs-mirror</text>
    <text x="860" y="354" font-size="20" fill="#8b949e">Hourly GitHub mirrors</text>
    <text x="860" y="376" font-size="20" fill="#8b949e">Private Gogs copies</text>

    <rect x="520" y="406" width="300" height="110" rx="10" fill="#161b22" stroke="#f78166" stroke-width="2"/>
    <text x="540" y="448" font-size="24" font-weight="700" fill="#f0f6fc">Hermes Agent</text>
    <text x="540" y="484" font-size="20" fill="#8b949e">Webapp at STACK_DOMAIN</text>
    <text x="540" y="506" font-size="20" fill="#8b949e">Claude Code, 1 at a time</text>

    <rect x="840" y="406" width="300" height="110" rx="10" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="860" y="448" font-size="20" fill="#8b949e">Compose project</text>
    <text x="860" y="474" font-size="20" fill="#8b949e">/opt/stack</text>

    <text x="480" y="572" font-size="20" fill="#8b949e">External</text>
    <rect x="480" y="582" width="150" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="555" y="611" font-size="20" text-anchor="middle" fill="#c9d1d9">Let's Encrypt</text>
    <rect x="653" y="582" width="150" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="728" y="611" font-size="20" text-anchor="middle" fill="#c9d1d9">DuckDNS</text>
    <rect x="826" y="582" width="150" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="901" y="611" font-size="20" text-anchor="middle" fill="#c9d1d9">GitHub</text>
    <rect x="999" y="582" width="150" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="1074" y="611" font-size="20" text-anchor="middle" fill="#c9d1d9">Claude</text>
  </g>
</svg>
