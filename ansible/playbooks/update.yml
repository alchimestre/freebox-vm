- name: Keep Arch Linux up to date
  hosts: freebox_vm
  vars:
    reboot_timeout_seconds: 600
  tasks:
    - name: Initialise the pacman keyring with this machine's own master key
      ansible.builtin.command:
        argv: [pacman-key, --init]
        creates: /etc/pacman.d/gnupg/trustdb.gpg
      register: pacman_keyring

    - name: Trust the Arch Linux and Arch Linux ARM packagers
      ansible.builtin.command:
        argv: [pacman-key, --populate]
      when: pacman_keyring is changed

    - name: Upgrade all packages
      community.general.pacman:
        update_cache: true
        upgrade: true

    - name: Check that the running kernel's modules are still installed
      ansible.builtin.stat:
        path: /usr/lib/modules/{{ ansible_facts.kernel }}
      register: running_kernel_modules

    - name: Reboot into the new kernel
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout_seconds }}"
      when: not running_kernel_modules.stat.exists
