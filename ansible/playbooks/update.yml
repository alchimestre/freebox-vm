- name: Keep Arch Linux up to date
  hosts: freebox_vm
  vars:
    reboot_timeout_seconds: 600
  tasks:
    - name: Upgrade all packages
      community.general.pacman:
        update_cache: true
        upgrade: true

    - name: Check that the running kernel's modules are still installed
      ansible.builtin.stat:
        path: /usr/lib/modules/{{ ansible_facts.kernel }}
      register: running_kernel_modules

    - name: Reboot into the new kernel
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout_seconds }}"
      when: not running_kernel_modules.stat.exists
