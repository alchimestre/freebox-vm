- name: Install Kiri as the Docker engine
  hosts: freebox_vm
  tasks:
    - name: Add the Kiri apt repository
      ansible.builtin.deb822_repository:
        name: kiri
        uris: https://download.runkiri.com
        suites: stable
        components: main
        signed_by: https://download.runkiri.com/kiri-archive-key.asc
        install_python_debian: true

    - name: Install the Kiri engine, Docker CLI and Compose
      ansible.builtin.apt:
        name:
          - kiri-lite
          - docker-cli
          - docker-compose
        update_cache: true
        install_recommends: false

    - name: Start Kiri
      ansible.builtin.systemd_service:
        name: kiri
        enabled: true
        state: started
